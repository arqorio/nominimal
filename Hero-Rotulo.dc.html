<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee:wght@400&family=Bungee+Inline&family=Archivo:ital,wght@0,400;0,600;0,800;1,600&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  :root{
    --barro:#a34a2a; --adobe:#c58a52; --tierra:#6f3a20; --ocre:#d69a43;
    --fucsia:#e5147d; --anil:#1b2a6b; --maiz:#f4b81f; --cobalto:#0f4bd1;
    --turquesa:#17b3ad; --verde:#4faa2e; --crema:#fdf1d6;
  }
  @keyframes shadowShift{0%,100%{background-position:0 0}50%{background-position:40px 26px}}
  a{color:var(--tierra);text-decoration:none}
  a:hover{color:var(--fucsia)}
  body{margin:0}
</style>
</helmet>
<div style="position:relative;min-height:100vh;overflow:hidden;font-family:'Archivo',sans-serif;
   background:
     linear-gradient(180deg, rgba(111,58,32,.15), rgba(111,58,32,.4)),
     radial-gradient(140% 100% at 50% -10%, var(--ocre), var(--barro) 60%, var(--tierra) 100%);">

  <div style="position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:multiply;
     background-image:repeating-linear-gradient(58deg, transparent 0 34px, rgba(56,22,8,1) 34px 40px);
     background-size:80px 80px;animation:shadowShift 12s ease-in-out infinite"></div>

  <header style="position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;
     padding:22px 40px;color:var(--crema);border-bottom:4px dashed var(--maiz)">
    <div style="font-family:'Bungee',sans-serif;font-size:22px;color:var(--maiz)">NO MINIMAL</div>
    <nav style="display:flex;gap:24px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--crema)">
      <a style="color:var(--crema)" href="#construccion">Construcción</a>
      <a style="color:var(--crema)" href="#luz">Luz</a>
      <a style="color:var(--crema)" href="#cultura">Cultura</a>
      <a style="color:var(--crema)" href="#manifiesto">Manifiesto</a>
    </nav>
  </header>

  <div style="position:relative;z-index:5;text-align:center;padding:44px 24px 20px;max-width:1100px;margin:0 auto">
    <span style="display:inline-block;background:var(--fucsia);color:#fff;font-weight:800;text-transform:uppercase;
       letter-spacing:.18em;font-size:12px;padding:8px 16px;transform:rotate(-1.5deg)">Tesis rectora · Orelio Martínez</span>

    <h1 style="margin:18px 0 0;line-height:.98;text-transform:uppercase">
      <span style="display:block;font-family:'Bungee Inline',sans-serif;color:var(--crema);
         font-size:clamp(40px,6vw,86px);letter-spacing:.01em;text-shadow:5px 6px 0 rgba(56,22,8,.55)">América Latina</span>
      <span style="display:inline-block;font-family:'Bungee',sans-serif;background:var(--maiz);color:var(--tierra);
         font-size:clamp(64px,12vw,168px);padding:.02em .12em;margin:8px 0;transform:rotate(-2deg);
         box-shadow:10px 12px 0 rgba(56,22,8,.5)">NO</span>
      <span style="display:block;font-family:'Bungee',sans-serif;color:var(--turquesa);
         font-size:clamp(40px,7vw,98px);text-shadow:4px 5px 0 rgba(56,22,8,.5)">puede ser minimalista</span>
    </h1>

    <p style="max-width:56ch;margin:26px auto 0;color:var(--crema);font-size:20px;line-height:1.55;font-weight:600;
       text-shadow:0 2px 8px rgba(56,22,8,.7)">
      La textura no es decoración: es protección. El alero no es ornamento: es sombra.
      Una expresión propia, coherente y legítima.
    </p>

    <div style="display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap">
      <a href="#construccion" style="background:var(--fucsia);color:#fff;font-family:'Bungee',sans-serif;font-size:14px;
         padding:16px 26px;box-shadow:6px 6px 0 var(--tierra)">EXPLORAR</a>
      <a href="#manifiesto" style="border:4px solid var(--maiz);color:var(--maiz);font-family:'Bungee',sans-serif;
         font-size:14px;padding:14px 26px">MANIFIESTO</a>
    </div>
  </div>

  <div style="position:relative;z-index:5;display:flex;gap:14px;justify-content:center;align-items:flex-end;
     padding:12px 40px 46px;max-width:1200px;margin:0 auto">
    <div style="position:relative;width:200px;height:150px;border:5px solid var(--maiz);transform:rotate(-3deg);box-shadow:6px 8px 0 rgba(56,22,8,.4)">
      <image-slot id="rot-1" shape="rect" placeholder="Adobe / Caral"></image-slot></div>
    <div style="position:relative;width:240px;height:200px;border:5px solid var(--turquesa);transform:rotate(1.5deg);box-shadow:6px 8px 0 rgba(56,22,8,.4)">
      <image-slot id="rot-2" shape="rect" placeholder="Ladrillo visto"></image-slot></div>
    <div style="position:relative;width:200px;height:150px;border:5px solid var(--fucsia);transform:rotate(3deg);box-shadow:6px 8px 0 rgba(56,22,8,.4)">
      <image-slot id="rot-3" shape="rect" placeholder="Fachada rosa"></image-slot></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:940}}"></script>
</body>
</html>
